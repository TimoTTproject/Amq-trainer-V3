<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161a2b"/>
      <stop offset="1" stop-color="#0f1117"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="12%" r="60%">
      <stop offset="0" stop-color="#2a2f55"/>
      <stop offset="1" stop-color="#0f1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6c8cff"/>
      <stop offset="1" stop-color="#8a6cff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- pastille note de musique -->
  <g transform="translate(110,150)">
    <rect width="120" height="120" rx="28" fill="url(#accent)"/>
    <g transform="translate(34,28)" fill="#fff">
      <rect x="40" y="0" width="10" height="56" rx="3"/>
      <rect x="40" y="0" width="26" height="9" rx="4"/>
      <circle cx="14" cy="58" r="16"/>
      <rect x="28" y="6" width="10" height="52" rx="3"/>
    </g>
  </g>

  <!-- titre -->
  <text x="260" y="225" fill="#ffffff" font-size="78" font-weight="800">Anime Music Quiz</text>
  <text x="262" y="285" fill="#9aa0b4" font-size="34" font-weight="500">Devine l'anime à son opening (ou ending)</text>

  <!-- chips features -->
  <g font-size="26" font-weight="700">
    <g transform="translate(110,400)">
      <rect width="250" height="58" rx="29" fill="#1a1d29" stroke="#2a2f42"/>
      <text x="125" y="38" fill="#e7e9f0" text-anchor="middle">⚔  Multijoueur</text>
    </g>
    <g transform="translate(378,400)">
      <rect width="250" height="58" rx="29" fill="#1a1d29" stroke="#2a2f42"/>
      <text x="125" y="38" fill="#e7e9f0" text-anchor="middle">🎴  Cartes gacha</text>
    </g>
    <g transform="translate(646,400)">
      <rect width="230" height="58" rx="29" fill="#1a1d29" stroke="#2a2f42"/>
      <text x="115" y="38" fill="#e7e9f0" text-anchor="middle">🏆  Classements</text>
    </g>
  </g>

  <!-- raretés -->
  <g transform="translate(110,505)">
    <circle cx="14" cy="14" r="14" fill="#4a5066"/>
    <circle cx="54" cy="14" r="14" fill="#3aa0ff"/>
    <circle cx="94" cy="14" r="14" fill="#b06cff"/>
    <circle cx="134" cy="14" r="14" fill="#ffb648"/>
    <circle cx="174" cy="14" r="14" fill="#ff5d8f"/>
    <text x="208" y="22" fill="#9aa0b4" font-size="24">5 raretés à collectionner</text>
  </g>

  <text x="1090" y="585" fill="#6c8cff" font-size="30" font-weight="700" text-anchor="end">amqtrainer.fr</text>
</svg>
