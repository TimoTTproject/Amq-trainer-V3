name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Installe les dépendances (le postinstall lance `prisma generate`,
      # qui n'a pas besoin de base de données).
      - run: npm ci

      # Checks statiques : syntaxe de TOUS les .js (dont les modules front
      # lazy-loadés, jamais require par les tests) + redéclarations dans le
      # scope global partagé du front. Sans navigateur ni base de données.
      - run: npm run check

      # Lint ciblé « vrais bugs » (voir eslint.config.js : règles relâchées sur
      # public/ à cause du scope global partagé entre fichiers front).
      - run: npm run lint

      # Tests de logique pure — pas de base de données requise
      # (les migrations du `prestart` ne sont PAS déclenchées par `npm test`).
      - run: npm test

      # Parcours public/invité réel, en bureau et mobile. Le serveur de test utilise
      # une URL PostgreSQL factice : ces scénarios ne lisent ni n'écrivent en BDD.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
